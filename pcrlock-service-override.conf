# A policy made through the varlink interface (fwupd) keeps the PCRs of
# the current one, and sdbootutil publishes it in the ESP afterwards
# (see `sync_pcrlock_policy`).  Without a policy, --pcr= is empty and
# systemd-pcrlock uses its default PCRs
[Service]
ExecStart=
ExecStart=/usr/bin/sh -c 'exec /usr/lib/systemd/systemd-pcrlock --location=770 --pcr="$$(jq -r "[.pcrValues[].pcr] | unique | @csv" /var/lib/systemd/pcrlock.json 2>/dev/null)"'
ExecStopPost=-/usr/bin/sdbootutil sync-pcrlock-policy
