# Since systemd 262 systemd-cryptsetup measures the volume key via
# systemd-pcrextend.socket, that is only started when booted from a
# UKI (ConditionSecurity=measured-os).  Start it whenever there is a
# TPM2, so the measurement is also done when booted from a kernel and
# an initrd.  The empty assignment resets the conditions of the unit
[Unit]
ConditionSecurity=
ConditionSecurity=tpm2
